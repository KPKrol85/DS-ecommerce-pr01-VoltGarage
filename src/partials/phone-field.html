<label class="input-group">
  <span>Telefon</span>
  <input
    type="tel"
    name="phone"
    autocomplete="tel"
    inputmode="tel"
    minlength="7"
    maxlength="20"
    pattern="^[0-9+][0-9\s\-]{6,19}$"
    title="Np. 533 537 091 lub +48 533 537 091."
    required
    aria-required="true"
  />
</label>
